name: Release

# Tag-driven, after HEAD's release.yml, for Windows and one (stable) channel. A release is cut by
# pushing its tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag runs:
#   1. gate: the type-check, rustfmt, clippy and the Rust tests. A red tree never builds.
#   2. build: scripts/release.mjs stamps the release into the files (the changelog's "Unreleased"
#      heading takes the version and the day's date, and the version goes into package.json,
#      Cargo.toml, Cargo.lock and tauri.conf.json), the notes come from that changelog entry, and
#      tauri-action builds the NSIS installer, signs the updater artifacts and puts them, with
#      latest.json, in a DRAFT GitHub release. Then the stamped files go to main as
#      "Release X.Y.Z", so the repo keeps the date and the version.
# Publishing the draft makes it the latest release, whose latest.json installed copies read
# (plugins.updater.endpoints in tauri.conf.json). A draft lets a human look before it ships.
#
# Run by hand (Actions, Release, Run workflow), it runs the gate alone.
#
# Security, as in HEAD's: the tag's version is checked against a strict X.Y.Z pattern first, then
# reaches later steps only as an environment variable, never templated into a run: block, so a
# crafted tag can't run shell with the signing key in scope.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release, and commit the stamped release to main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release is dated with the day in the maintainer's time zone, the day the tag was pushed.
  RELEASE_TZ: Asia/Kolkata

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm exec tsc --noEmit -p .
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  build:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main's history, to put the release commit on it
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version and date from the tag
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"     # a default env var, not a workflow expression
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' is not a release version (expected vX.Y.Z)"
            exit 1
          fi
          date="$(TZ="$RELEASE_TZ" date +%F)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Releasing hrtz $version, dated $date"

      # The changelog's "Unreleased" heading takes the version and the date, and the version goes
      # into the app, so the build is that version and its What's new is dated.
      - name: Stamp the release
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: node scripts/release.mjs "$VERSION" "$DATE"

      - run: pnpm install --frozen-lockfile

      # The release's text is the version's changelog entry: the notes What's new shows.
      - name: Release notes from the changelog
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/release-notes.mjs "$VERSION"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The minisign key that signs the updater artifacts (its public half is the pubkey in
          # tauri.conf.json); no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "hrtz ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # The signed updater artifacts are made only here, so a clone builds without the key.
          args: --config src-tauri/tauri.release.conf.json

      # The stamped files go to main, so the repo keeps the release's date and version. Only after
      # a good build: a failed one leaves main as it was. If main moved after the tag, the commit
      # goes on top of it; tag the tip of main so new notes don't land in a released version.
      - name: Commit the release to main
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git fetch origin main
          # A tag off main (a branch nobody merged) must not bring that branch into main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag isn't on main, so the release wasn't committed there. Stamp it on main by hand: node scripts/release.mjs $VERSION <date>."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Release $VERSION"
          if ! git rebase --autostash origin/main; then
            echo "::error::main changed the same lines since the tag. Stamp it by hand: node scripts/release.mjs $VERSION <date>, then commit."
            exit 1
          fi
          git push origin HEAD:main

name: Request support for a mouse
description: Your mouse isn't supported yet.
labels: ["mouse request"]
body:
  - type: markdown
    attributes:
      value: |
        In hrtz, click **Inspect a mouse** in the title bar (or the **Not supported yet** badge on your mouse), pick your mouse, check it and save the report, then drag the file into the box below. It's what lets us add support for your mouse.
  - type: input
    id: mouse
    attributes:
      label: Mouse
      description: Its brand and model, as on the box.
      placeholder: ATK U2 Plus
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: IDs
      description: Filled in by hrtz, from the report.
      placeholder: 373B:110D
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Drag the file hrtz saved in here.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: hrtz's check
      description: Filled in by hrtz, where it could check the mouse.
  - type: input
    id: connection
    attributes:
      label: Connection
      description: Receiver, cable or Bluetooth.
      placeholder: 2.4 GHz receiver
  - type: checkboxes
    id: test
    attributes:
      label: Testing
      options:
        - label: I can try an early version on my mouse and send what hrtz shows.
  - type: input
    id: version
    attributes:
      label: hrtz version
  - type: input
    id: windows
    attributes:
      label: Windows

name: Request support for a mouse
description: Your mouse isn't supported yet.
labels: ["mouse request"]
body:
  - type: markdown
    attributes:
      value: |
        In hrtz, click **Inspect a mouse** in the title bar (or the **Not supported yet** badge on your mouse), pick your mouse and check it. **Request support on GitHub** there opens this form with the report already in it: all that's left is to submit it.

        If your mouse has both a receiver and a cable, check it on each. Both go into the same report.
  - type: input
    id: mouse
    attributes:
      label: Mouse
      description: Its brand and model, as on the box.
      placeholder: ATK U2 Plus
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: "hrtz fills this in, with the report inside it: leave the line starting hrtz-report as it is. A report saved as a file can be dragged in here instead."
    validations:
      required: true
  - type: checkboxes
    id: test
    attributes:
      label: Testing
      options:
        - label: I can try an early version on my mouse and send what hrtz shows.

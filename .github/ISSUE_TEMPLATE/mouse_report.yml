name: Report how your mouse works
description: hrtz with your mouse, especially a model that isn't tested yet.
labels: ["mouse report"]
body:
  - type: markdown
    attributes:
      value: |
        A model hrtz lists as **Not tested** should work, but nobody has tried it yet. A report from its owner tells us what to fix before calling it tested.

        In hrtz, click **Inspect a mouse** in the title bar (or the **Not tested** badge on your mouse), pick your mouse and run its 2-minute check. **Open GitHub issue** there opens this form with the report already in it: all that's left is to submit it.

        If your mouse has both a receiver and a cable, check it on each. Both go into the same report. hrtz backs your mouse up the first time it connects (Settings → Backups), so you can put everything back.
  - type: input
    id: mouse
    attributes:
      label: Mouse
      placeholder: Z2 mini
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: "hrtz fills this in, with the report inside it: leave the line starting hrtz-report as it is. A report saved as a file can be dragged in here instead."
    validations:
      required: true
  - type: textarea
    id: issues
    attributes:
      label: Anything that doesn't work, or looks wrong
      description: "What the check can't see, such as a setting that doesn't seem to apply, a wrong name or picture, or the in-game HUD."

name: Report how your mouse works
description: hrtz with your mouse, especially a model that isn't tested yet.
labels: ["mouse report"]
body:
  - type: markdown
    attributes:
      value: |
        hrtz is tested on the **Zaopin Z1 PRO MAX** and the **Logitech PRO X SUPERLIGHT**. The other models it lists should work, but nobody has tried them yet. A report from any of them tells us what to fix before calling it supported.

        The quickest report: **Settings → Mouse → Help test your …** runs a 2-minute check and saves a report file. Its summary fills in below; drag the file it saved into the box too.

        hrtz backs your mouse up the first time it connects (Settings → Backups), so you can put everything back.
  - type: input
    id: mouse
    attributes:
      label: Mouse
      placeholder: Z2 mini
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: hrtz's check
      description: Filled in by Help test. Drag the report file it saved in here too.
      render: text
  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: Shown in Settings, under Mouse.
      placeholder: "2.17"
  - type: input
    id: connection
    attributes:
      label: Connection
      placeholder: 4K receiver
  - type: checkboxes
    id: works
    attributes:
      label: What works
      description: Tick what behaves as it should.
      options:
        - label: The mouse is recognised, with the right name and picture
        - label: Battery level and charging
        - label: DPI stages, and the DPI button if it has one
        - label: Polling rate
        - label: Lift-off distance, sensor mode, motion sync, angle snapping, ripple control
        - label: Click debounce and the peak performance timeout
        - label: Buttons
        - label: Profiles
        - label: Backups and factory settings
        - label: Sleep after
        - label: The in-game HUD
  - type: textarea
    id: issues
    attributes:
      label: What doesn't work, or looks wrong
      description: Anything unticked above, with what happened instead.
  - type: input
    id: version
    attributes:
      label: hrtz version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: Windows 11 24H2 (26100)
